<div class="auth-page">
  <div class="auth-card">
    <h2>Login</h2>
    <form (ngSubmit)="onSubmit()">
      <label>
        Username
        <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" />
      </label>

      <label>
        Password
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.94"></path>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.83 21.83 0 0 1-2.16 3.19"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </label>

      <button type="submit">Login</button>
    </form>

    <p>
      New here?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</div>

<div class="popup-backdrop" *ngIf="popup">
  <div class="popup-card" [class.success]="popup.type === 'success'" [class.error]="popup.type === 'error'">
    <p>{{ popup.message }}</p>
    <button type="button" (click)="closePopup()">OK</button>
  </div>
</div>
