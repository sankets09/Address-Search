<div class="auth-page">
  <div class="auth-card">
    <div class="brand-block">
      <div class="brand-mark">P</div>
      <div>
        <p class="eyebrow">Welcome back</p>
        <h2>Login</h2>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" novalidate>
      <label>
        <span>Username</span>
        <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" placeholder="Enter your username" />
      </label>

      <label>
        <span>Password</span>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
        />
      </label>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading" class="spinner-inline">
          <span class="spinner"></span>
          Signing in...
        </span>
      </button>
    </form>

    <p class="switch-copy">
      New here?
      <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>

<div class="popup-backdrop" *ngIf="popup">
  <div class="popup-card" [class.success]="popup.type === 'success'" [class.error]="popup.type === 'error'">
    <p>{{ popup.message }}</p>
    <button type="button" (click)="closePopup()">OK</button>
  </div>
</div>
