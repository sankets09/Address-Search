<div class="auth-page">
  <div class="auth-card">
    <div class="brand-block">
      <div class="brand-mark">P</div>
      <div>
        <p class="eyebrow">Create account</p>
        <h2>Register</h2>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" novalidate>
      <label>
        <span>Username</span>
        <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" placeholder="Choose a username" />
      </label>

      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" placeholder="Enter your email" />
      </label>

      <label>
        <span>Password</span>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="new-password"
          placeholder="Create a password"
        />
      </label>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Register</span>
        <span *ngIf="isLoading" class="spinner-inline">
          <span class="spinner"></span>
          Creating account...
        </span>
      </button>
    </form>

    <p class="switch-copy">
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>

<div class="popup-backdrop" *ngIf="popup">
  <div class="popup-card" [class.success]="popup.type === 'success'" [class.error]="popup.type === 'error'">
    <p>{{ popup.message }}</p>
    <button type="button" (click)="closePopup()">OK</button>
  </div>
</div>
